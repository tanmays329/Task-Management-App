<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-5">

            <div>

                <h1 class="text-3xl font-bold tracking-wide">

                    TaskFlow

                </h1>

                <p class="text-blue-100 text-sm">

                    Organize your work efficiently

                </p>

            </div>

            <div class="flex items-center gap-5">

                <div class="text-right">

                    <h2 id="welcomeUser" class="font-semibold text-lg">

                        Welcome

                    </h2>

                    <p class="text-blue-100 text-sm">

                        Stay productive today

                    </p>

                </div>

                <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600">
                    Logout
                </button>

            </div>

        </div>
    </nav>

    <!-- ================= STATS ================= -->

    <div class="max-w-6xl mx-auto mt-8">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-5">

            <div
                class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 p-6">
                <h2 class="text-gray-500 font-medium">Total Tasks</h2>
                <p id="totalTasks" class="text-4xl font-bold mt-3 text-blue-600">0</p>
            </div>

            <div
                class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 p-6">
                <h2 class="text-gray-500 font-medium    ">Pending</h2>
                <p id="pendingTasks" class="text-3xl font-bold mt-3 text-yellow-500">0</p>
            </div>

            <div
                class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 p-6">
                <h2 class="text-gray-500 font-medium">In Progress</h2>
                <p id="progressTasks" class="text-3xl font-bold mt-3 text-purple-500">0</p>
            </div>

            <div
                class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 p-6">
                <h2 class="text-gray-500 font-medium">Completed</h2>
                <p id="completedTasks" class="text-3xl font-bold mt-3 text-green-600">0</p>
            </div>

        </div>

    </div>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto mt-10">

        <!-- Add Task -->
        <div class="bg-white rounded-xl shadow p-6">

            <h2 class="text-2xl font-bold mb-5">
                Add New Task
            </h2>

            <form id="taskForm">

                <input id="title" type="text" placeholder="Task Title" class="w-full border rounded-lg p-3 mb-4">

                <textarea id="description" placeholder="Task Description"
                    class="w-full border rounded-lg p-3 mb-4"></textarea>

                <select id="status" class="w-full border rounded-lg p-3 mb-4">

                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>

                </select>

                <div class="mt-4">

                    <label class="font-medium text-gray-700">

                        Due Date

                    </label>

                    <input id="dueDate" type="date" class="w-full border rounded-xl p-3 mt-2">

                </div>

                <button id="submitBtn" type="submit"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">

                    Add Task

                </button>

            </form>

        </div>

        <!-- Search -->


        <div class="bg-white rounded-2xl shadow-lg p-5 mt-8 flex flex-col md:flex-row gap-4 items-center">

            <input id="search" type="text" placeholder="Search tasks..."
                class="flex-1 bg-white border border-gray-300 rounded-xl px-5 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition">

            <select id="filterStatus" class="border rounded-lg p-3">

                <option value="">All</option>
                <option>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>

            </select>

            <select id="sortTasks" class="border rounded-lg p-3">

                <option value="latest">Latest</option>
                <option value="oldest">Oldest</option>

            </select>

        </div>

        <!-- Tasks -->
        <div id="taskContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">

        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center items-center gap-3 mt-10 mb-10">

        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

            <div class="bg-white rounded-2xl shadow-2xl p-8 w-96">

                <h2 class="text-2xl font-bold text-gray-800">
                    Delete Task
                </h2>

                <p class="text-gray-500 mt-3">
                    Are you sure you want to delete this task?
                </p>

                <p class="text-red-500 text-sm mt-2">
                    This action cannot be undone.
                </p>

                <div class="flex justify-end gap-3 mt-8">

                    <button id="cancelDelete" class="px-5 py-2 rounded-xl border hover:bg-gray-100 transition">

                        Cancel

                    </button>

                    <button id="confirmDelete"
                        class="px-5 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 transition">

                        Delete

                    </button>

                </div>

            </div>

        </div>

        <!-- ================= EDIT MODAL ================= -->

        <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

            <div class="bg-white rounded-2xl shadow-2xl p-8 w-[500px]">

                <h2 class="text-2xl font-bold mb-6">

                    Edit Task

                </h2>

                <input id="editTitle" type="text" placeholder="Task Title" class="w-full border rounded-xl p-3 mb-4">

                <textarea id="editDescription" placeholder="Description"
                    class="w-full border rounded-xl p-3 mb-4"></textarea>

                <select id="editStatus" class="w-full border rounded-xl p-3 mb-6">

                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>

                </select>

                <div class="mt-4">

                    <label class="font-medium">

                        Due Date

                    </label>

                    <input id="editDueDate" type="date" class="w-full border rounded-xl p-3 mt-2">

                </div>

                <div class="flex justify-end gap-3">

                    <button id="cancelEdit" class="px-5 py-2 border rounded-xl">

                        Cancel

                    </button>

                    <button id="saveEdit" class="px-5 py-2 bg-blue-600 text-white rounded-xl">

                        Save Changes

                    </button>

                </div>

            </div>

        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-[999]">

            <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center">

                <div class="w-14 h-14 border-4 border-blue-600 border-t-transparent rounded-full animate-spin">
                </div>

                <p class="mt-5 text-gray-700 font-semibold">
                    Loading...
                </p>

            </div>

        </div>






        <script src="./js/dashboard.js"></script>
        <script src="./js/toast.js"></script>
        <script src="./js/loader.js"></script>

</body>

</html>
